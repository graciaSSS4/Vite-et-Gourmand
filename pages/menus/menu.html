<div class="main-plate text-center text-white">
  <div class="main-plate-content">
    <h1>Nos menus</h1>
  </div>
</div>
<div class="container">
  <p>
    <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFilters" aria-expanded="false" aria-controls="collapseFilters">Filtres</button>
  </p>
  <div class="collapse" id="collapseFilters">
    <div class="card card-body">
      <div class="mb-3">
        <label id="menuFilter" for="selectNbp" class="form-label">Nombre de personne minimum</label>
        <select class="form-select" id="selectNbp" name="Nombre">
          <option value="">Tous</option>
          <option>2</option>
          <option>4</option>
          <option>6</option>
          <option>8</option>
          <option>10</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="selectPrice" class="form-label">Prix maximum</label>
        <select class="form-select" id="selectPrice" name="Nombre">
          <option value="">Tous</option>
          <option>50</option>
          <option>80</option>
          <option>100</option>
          <option>120</option>
          <option>150</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="selectTheme" class="form-label">Thème</label>
        <select class="form-select" id="selectTheme" name="Nombre">
          <option value="">Tous</option>
          <option>Noël</option>
          <option>Pâques</option>
          <option>Classique</option>
          <option>Événement</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="selectRegime" class="form-label">Régime alimentaire</label>
        <select class="form-select" id="selectRegime" name="Nombre">
          <option value="">Tous</option>
          <option>Classique</option>
          <option>Vegan</option>
          <option>Sans Gluten</option>
          <option>Végétarien</option>
          <option>Halal</option>
          <option>Sans lactose</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="selectPrmin" class="form-label">Prix min</label>
        <input type="number" id="selectPrmin" placeholder="50" />
        <label for="selectPrmax" class="form-label">Prix max</label>
        <input type="number" id="selectPrmax" placeholder="150" />
      </div>
    </div>
  </div>
  <div class="container">
    <div class="row row-cols-2 row-cols-lg-3" id="allCards"></div>
  </div>
</div>
