<div class="main-plate text-center text-white">
  <div class="main-plate-content">
    <h1>Espace employé</h1>
  </div>
</div>
<div class="container"></div>
<ul class="nav nav-pills mb-3 justify-content-center" id="pills-tab" role="tablist">
  <li class="nav-item" role="presentation">
    <button
      class="nav-link active"
      id="pills-inscription-tab"
      data-bs-toggle="pill"
      data-bs-target="#pills-inscription"
      type="button"
      role="tab"
      aria-controls="pills-inscription"
      aria-selected="true"
    >
      Gestion de Vite & Gourmand
    </button>
  </li>
  <li class="nav-item" role="presentation">
    <button
      class="nav-link"
      id="pills-connexion-tab"
      data-bs-toggle="pill"
      data-bs-target="#pills-connexion"
      type="button"
      role="tab"
      aria-controls="pills-connexion"
      aria-selected="false"
    >
      Commandes
    </button>
  </li>
</ul>
<div class="tab-content" id="pills-tabContent">
  <div class="tab-pane fade show active" id="pills-inscription" role="tabpanel" aria-labelledby="pills-inscription-tab" tabindex="0">
    <div class="container">
      <section>
        <h2 class="text-center text-primary fw-bold">Modifier ou Supprimer plats, menus et horaires</h2>
        <div id="chosenMenu"></div>
      </section>

      <!--les modals devront être insérées ici-->
    </div>
  </div>

  <div class="tab-pane fade" id="pills-connexion" role="tabpanel" aria-labelledby="pills-connexion-tab" tabindex="0">
    <div class="container">
      <form id="signinForm">
        <div class="mb-3">
          <label for="EmailSigninInput" class="form-label">Email</label>
          <input type="email" class="form-control" id="EmailSigninInput" placeholder="test@mail.fr" name="Email" />
        </div>
        <div class="mb-3">
          <label for="PasswordSigninInput" class="form-label">Mot de passe</label>
          <input type="password" class="form-control" id="PasswordSigninInput" name="password" />
        </div>
        <div class="invalid-feedback">L'adresse mail et le mot de passe ne correspondent pas</div>
        <div class="text-center">
          <button type="button" class="btn btn-primary" id="btnSingin">Connexion</button>
        </div>
      </form>

      <div class="text-center text-primary pt-3">
        <a href="/forgotPassword">Mot de passe oublié ?</a>
      </div>
    </div>
  </div>
</div>
