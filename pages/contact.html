<div class="main-plate text-center text-white">
  <div class="main-plate-content">
    <h1>Contact</h1>
  </div>
</div>

<div class="container">
  <form>
    <div class="mb-3">
      <label for="TitleInput" class="form-label">Titre</label>
      <input type="text" class="form-control" id="TitleInput" placeholder="Titre" />
    </div>
    <div class="mb-3">
      <label for="DescriptionInput" class="form-label">Description</label>
      <textarea class="form-control" id="DescriptionInput" placeholder="Dites-nous en plus!"></textarea>
    </div>
    <div class="mb-3">
      <label for="EmailInput" class="form-label">Email</label>
      <input type="email" class="form-control" id="EmailInput" placeholder="votremail@mail.fr" name="Email" />
    </div>

    <div class="d-flex justify-content-center gap-3">
      <button type="submit" class="btn btn-primary">Envoyer</button>
    </div>
  </form>
</div>
