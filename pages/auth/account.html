<div class="main-plate text-center text-white">
  <div class="main-plate-content">
    <h1>Mon compte</h1>
  </div>
</div>

<div class="container">
  <form id="FormulaireAccount">
    <div class="mb-3">
      <label for="nomInput" class="form-label">Nom</label>
      <input type="text" class="form-control" id="nomInput" placeholder="Votre nom" value="John" name="nom" />
    </div>
    <div class="mb-3">
      <label for="prenomInput" class="form-label">Prénom</label>
      <input type="text" class="form-control" id="prenomInput" placeholder="Votre prénom" value="Doe" name="prenom" />
    </div>
    <div class="mb-3">
      <label for="adressInput" class="form-label">Adresse complète</label>
      <input type="text" class="form-control" id="adressInput" placeholder="Numéro et nom de rue" name="adress" />
    </div>
    <div class="mb-3">
      <label for="adresscomplInput" class="form-label">Complément d'adresse</label>
      <input type="text" class="form-control" id="adresscomplInput" placeholder="App, Bât, Esc, Lieu-dit..." name="adresscompl" />
    </div>
    <div class="mb-3">
      <label for="codepInput" class="form-label">Code postal</label>
      <input type="text" class="form-control" id="codepInput" placeholder="75 001" name="code" />
    </div>
    <div class="mb-3">
      <label for="cityInput" class="form-label">Ville</label>
      <input type="text" class="form-control" id="cityInput" placeholder="Ville" name="city" />
    </div>
    <div class="d-flex justify-content-center gap-3">
      <button type="button" class="btn btn-primary" id="btn-Modify">Modifer vos informations</button>
      <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#DeleteAccountModal">Supprimer mon compte</button>
    </div>
  </form>

  <!-- Modal Delete -->
  <div class="modal fade" id="DeleteAccountModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="DeleteAccountModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="DeleteAccountModalLabel">Êtes-vous sûr de vouloir supprimer ce compte ?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">Lorsque vous supprimer votre compte, vous ne pourrez plus vous connecter.</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-danger" id="btn-ConfirmedDelete">Confirmer</button>
        </div>
      </div>
    </div>
  </div>
</div>
