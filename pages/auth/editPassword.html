<div class="main-plate text-center text-white">
  <div class="main-plate-content">
    <h1>Changement de mot de passe</h1>
  </div>
</div>
<div class="container">
  <form id="editPassword">
    <div class="mb-3">
      <label for="passwordInput" class="form-label">Mot de passe</label>
      <input type="password" class="form-control" id="passwordInput" name="password" />
    </div>
    <div class="mb-3">
      <label for="validatePasswordInput" class="form-label">Validez votre mot de passe</label>
      <input type="password" class="form-control" id="validatePasswordInput" name="validatePassword" />
    </div>
    <div class="text-center">
      <button type="button" class="btn btn-primary" id="btn-validation-editP">Changer mon mot de passe</button>
    </div>
  </form>

  <div class="text-center text-primary pt-3">
    <a href="/account">Modifier mes informations personnelles</a>
  </div>
</div>
